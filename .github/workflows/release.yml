name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows Binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force
          Copy-Item "target/x86_64-pc-windows-msvc/release/zenith-clock.exe" -Destination "dist/"
          Copy-Item "install_autostart.bat" -Destination "dist/"
          Copy-Item "uninstall_autostart.bat" -Destination "dist/"
          Copy-Item "README.md" -Destination "dist/"
          Copy-Item "LICENSE" -Destination "dist/"
          Compress-Archive -Path "dist/*" -DestinationPath "zenith-clock-windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zenith-clock-windows-x64.zip
            target/x86_64-pc-windows-msvc/release/zenith-clock.exe
          generate_release_notes: true
          draft: false
          prerelease: false
